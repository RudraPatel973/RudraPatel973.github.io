</g>
<g transform="translate(648 170)" fill="#423c30" font-family="monospace" text-anchor="middle"><text y="-25" font-size="16" font-weight="bold">N</text><path d="m0-15 8 25-8-5-8 5Z" fill="#c06d55" stroke="#423c30" stroke-width="2"/></g>
<text x="27" y="546" font-family="monospace" font-size="11" fill="#8b7754">A LITTLE ADVENTURE, ONE CHAPTER AT A TIME</text>
